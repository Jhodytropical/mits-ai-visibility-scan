[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-visibility-scan"
version = "0.1.0"
description = "Does AI recommend this local business when a customer asks? Scans ChatGPT, Claude and Gemini and writes an owner-friendly report."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "MITS SFL", email = "info@mitssfl.net" }]
requires-python = ">=3.10"
dependencies = ["anthropic>=1.13,<2", "requests>=2.31"]
keywords = ["ai search", "local seo", "geo", "chatgpt", "visibility", "small business"]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License", "Operating System :: OS Independent"]

[project.urls]
Homepage = "https://www.mitssfl.net"

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
ai-visibility-scan = "ai_visibility_scan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
